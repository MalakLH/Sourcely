[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcely-webguide"
version = "0.1.0"
description = "Sourcely web search and research pipeline"
requires-python = ">=3.11"

dependencies = [
    "httpx",
    "pydantic",
]

[tool.setuptools]
packages = [
    "webguide_service",
    "webguide_service.app",
    "webguide_service.app.schema",
    "webguide_service.app.search",
]

package-dir = { "webguide_service" = "." }