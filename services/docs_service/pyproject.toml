[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcely-docs"
version = "0.1.0"
description = "Sourcely Docs Expert RAG System"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "lancedb>=0.3.0",
    "sentence-transformers>=2.2.0",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "markdown",
    "tiktoken",
    "numpy",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
