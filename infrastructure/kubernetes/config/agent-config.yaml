apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: sourcely
data:
  APP_NAME: "Sourcely"
  APP_ENV: "development"
  APP_PORT: "8000"
  LOG_LEVEL: "INFO"

  OLLAMA_MODEL: "qwen3:4b"
  OLLAMA_TEMPERATURE: "0"

  DOCS_SERVICE_URL: "http://docs-service:8002"
  WEBGUIDE_SERVICE_URL: "http://webguide-service:8003"

  MAX_AGENT_STEPS: "5"