name: Sourcely CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:

  test-agent:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/agent_services

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Run tests
        working-directory: services/agent_services
        env:
          PYTHONPATH: ${{ github.workspace }}/services/agent_services:${{ github.workspace }}/services
        run: pytest -v