
services:

  agent-service:
    build:
      context: ../..
      dockerfile: services/agent_services/Dockerfile

    container_name: sourcely-agent

    ports:
      - "8000:8000"

    env_file:
      - ../../.env

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      SANDBOX_BASE_URL: http://sandbox-service:8001

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ../../services/agent_services/app:/app/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    depends_on:
      - sandbox-service

    restart: unless-stopped

  sandbox-service:
    build:
      context: ../..
      dockerfile: services/sandbox_service/dockerfile

    container_name: sourcely-sandbox

    env_file:
      - ../../.env

    environment:
      DOCKER_HOST: unix:///var/run/docker.sock

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    expose:
      - "8001"

    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest

    container_name: sourcely-searxng

    ports:
      - "8080:8080"

    volumes:
      - ./searxng:/etc/searxng:rw

    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET}

    restart: unless-stopped
